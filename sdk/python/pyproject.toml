[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit.core.buildapi"

[project]
name = "fluxora-sdk"
version = "0.1.0"
description = "Fluxora Backend: Off-chain companion to the streaming contract."
readme = "README.md"
authors = [
    { name = "Fluxora Team" }
]
license = { file = "LICENSE" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.8"
dependencies = []

[project.urls]
Homepage = "https://github.com/Fluxora-Org/Fluxora-Backend"
Repository = "https://github.com/Fluxora-Org/Fluxora-Backend"
