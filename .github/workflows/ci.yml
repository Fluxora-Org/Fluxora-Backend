name: CI

on:
  push:
    branches: [ main, develop, feature/* ]
  pull_request:
    branches: [ main, develop ]

jobs:
  node-version:
    name: Node.js Version Pin
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      # Fails when .nvmrc, package.json "engines.node", the Dockerfile and the
      # workflows do not all name the same Node.js version. See
      # scripts/check-node-version.mjs.
      - name: Check Node.js version pin
        run: node scripts/check-node-version.mjs

  typecheck:
    name: TypeScript Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Uses tsconfig.json directly; failures block the workflow.
      - name: Run TypeScript typecheck
        run: pnpm run typecheck

  lint:
    name: Lint (changed files)
    runs-on: ubuntu-latest
    env:
      # The PR base commit is available even when checkout creates only the
      # synthetic pull-request merge ref.
      LINT_BASE: ${{ github.event.pull_request.base.sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # The changed-files linter needs the PR base ref (origin/main),
          # not only the shallow merge checkout created for pull requests.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Deterministic, fail-closed lint of changed files only. Any violation
      # in a changed file fails the job, and no shell fallback can mask a
      # missing ESLint configuration. See scripts/lint-changed-files.mjs.
      - name: Run linter
        run: pnpm run lint:ci

  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: indexer_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --host=127.0.0.1 --username=test_user --dbname=indexer_test"
          --health-interval 10s
          --health-timeout 5s
          --health-start-period 30s
          --health-retries 20

      # Real Redis for the AdminStateLock integration suite
      # (tests/state/adminStateLock.concurrentReindex.test.ts). The suite is
      # gated on REDIS_INTEGRATION=true and asserts distributed-lock
      # contention and lease-based crash recovery against a live server.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Drift check: fail CI
      - name: SDK drift check (Python)
        run: node scripts/generate-sdk-python.mjs --check

      # Drift check: fail CI
      - name: SDK drift check (TypeScript)
        run: node scripts/generate-sdk-ts.mjs --check

      - name: Check migration naming policy
        run: pnpm run check:migrations

      # The database suites are guarded by DATABASE_URL so local/offline test
      # runs remain lightweight. In CI, give them a real PostgreSQL schema and
      # run the complete live-DB manifest explicitly so a future skip cannot
      # silently remove coverage.
      - name: Apply migrations for live database tests
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/indexer_test
        run: pnpm run migrate

      - name: Run live database integration suites
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/indexer_test
        run: >-
          pnpm exec vitest run --reporter=verbose
          tests/db/vacuumCollector.collect.test.ts
          tests/db/webhookOutbox.dispatchIndex.test.ts
          tests/db/streams.compositeIndexes.test.ts
          tests/db/logicalReplication.test.ts
          tests/db/contractEvents.partitionPruning.test.ts

      # Required gate: failing tests block the pipeline.
      - name: Run tests
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/indexer_test
          REPLAY_BATCH_SIZE: 100
          # Run the AdminStateLock real-Redis integration suite against the
          # Redis service above so lock contention/lease coverage executes on
          # every CI build instead of staying skipped.
          REDIS_INTEGRATION: 'true'
          REDIS_TEST_URL: redis://localhost:6379
        run: pnpm test:coverage:ci

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella

      # Required gate: build failures block the pipeline.
      - name: Build
        run: pnpm run build

  security:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Required gate: audit failures block the pipeline.
      - name: Run security audit
        run: pnpm audit --audit-level=moderate

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: indexer:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
