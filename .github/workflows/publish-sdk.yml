name: Publish SDKs

# Publication is automated from a tagged release: pushing a `v*` tag is the
# only path that puts the generated SDKs in front of consumers.
#
# The tag must match `openapi.yaml` `info.version`. The `verify` job refuses to
# publish otherwise, so a tag can never ship an SDK whose version disagrees with
# the API version it was generated from. See docs/sdk-publishing.md.
#
# Required repository secrets:
#   NPM_TOKEN        — npm automation token with publish access to @fluxora/sdk
#   PYPI_API_TOKEN   — PyPI API token scoped to the fluxora-sdk project
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  verify:
    name: Verify SDK versions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The committed SDKs must be exactly what the current spec generates.
      - name: SDK drift check (TypeScript)
        run: node scripts/generate-sdk-ts.mjs --check

      - name: SDK drift check (Python)
        run: node scripts/generate-sdk-python.mjs --check

      # `GITHUB_REF_NAME` is the pushed tag (e.g. `v0.1.0`).
      - name: Assert SDK versions match the release tag
        run: node scripts/check-sdk-version-sync.mjs --tag "${GITHUB_REF_NAME}"

  publish-typescript:
    name: Publish TypeScript SDK
    needs: [verify]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Publish @fluxora/sdk to npm
        run: pnpm --filter @fluxora/sdk publish --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-python:
    name: Publish Python SDK
    needs: [verify]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build sdist and wheel
        working-directory: sdk/python
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Publish fluxora-sdk to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdk/python/dist
          password: ${{ secrets.PYPI_API_TOKEN }}
